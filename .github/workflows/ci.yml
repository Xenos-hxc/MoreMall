name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: chatroom-master/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: chatroom-master
      - run: npm run build
        working-directory: chatroom-master
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: moremall_demo
          MYSQL_USER: demo
          MYSQL_PASSWORD: local-demo-change-me
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongo --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build backend
        run: mvn -B -ntp clean package
      - name: Initialize demo database
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pci-root-only moremall_demo < sql/schema.sql

          docker exec -i ${{ job.services.mongo.id }} mongo --quiet < sql/mongo-demo.js
      - name: Start services and check runtime
        run: |
          java -jar Eureka_Demo/target/Eureka_Demo-1.0-SNAPSHOT.jar > /tmp/eureka-service.log 2>&1 &
          java -jar ServiceDemo/target/ServiceDemo-1.0-SNAPSHOT.jar > /tmp/business-service.log 2>&1 &
          java -jar Zuul_Demo/target/Zuul_Demo-1.0-SNAPSHOT.jar > /tmp/gateway-service.log 2>&1 &
          python scripts/smoke.py
      - name: Print service logs on failure
        if: failure()
        run: cat /tmp/*-service.log
