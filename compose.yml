services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: local-root-demo-change-me
      MYSQL_DATABASE: moremall_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: local-demo-change-me
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  mongo:
    image: mongo:4.4
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./sql/mongo-demo.js:/docker-entrypoint-initdb.d/01-demo.js:ro
volumes:
  mysql-data:
  mongo-data:
